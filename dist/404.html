<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#35243D">
  <title>404 | Silverback Network</title>
  <link rel="icon" href="/assets/silverback-dark.png">
  <style>
    :root{color-scheme:light;font-family:Arial,Helvetica,sans-serif;background:#F5F3EB;color:#35243D}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;flex-direction:column}
    header,main,footer{width:min(1120px,calc(100% - 48px));margin-inline:auto}
    header{padding:36px 0}header img{width:174px;height:auto}
    main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:50px 0 85px}
    .eyebrow{text-transform:uppercase;font-size:12px;font-weight:700;letter-spacing:.14em}
    h1{font-size:clamp(55px,10vw,134px);line-height:.91;letter-spacing:-.065em;font-weight:900;margin:25px 0;max-width:930px}
    h1 span{background:#D7EF52;box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:0 .04em}
    p{font-size:clamp(17px,2.5vw,22px);line-height:1.5;max-width:650px}
    .actions{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:34px}
    .button{display:inline-block;background:#35243D;color:#F5F3EB;padding:15px 22px;text-decoration:none;font-weight:700;border:2px solid #35243D}
    .button:focus-visible,.link:focus-visible{outline:3px solid #d7ef52;outline-offset:4px}
    .button:hover{background:#D7EF52;color:#35243D}
    .link{color:#35243D;text-decoration-thickness:2px;text-underline-offset:5px;font-weight:700}
    footer{padding:26px 0;font-size:13px;border-top:1px solid rgba(53,36,61,.2)}
  </style>
</head>
<body>
  <header><a href="/" aria-label="Silverback Network Startseite"><img src="/assets/silverback-dark.png" alt="Silverback Network"></a></header>
  <main>
    <div class="eyebrow">Fehler 404 / Seite nicht gefunden</div>
    <h1>Falscher Weg.<br><span>Gute Leute.</span></h1>
    <p>Diese Seite gibt es hier nicht. Aber die passenden Menschen für deine nächste Herausforderung vielleicht schon.</p>
    <div class="actions"><a class="button" href="/">Zur Startseite ↗</a><a class="link" href="mailto:silverback@wescaleit.com">Direkt Kontakt aufnehmen</a></div>
  </main>
  <footer>Silverback Network · Eine Marke der wescaleIT AG</footer>
</body>
</html>
