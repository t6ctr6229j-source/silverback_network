name: Tally Pro Branding QA
on:
  pull_request:
    paths:
      - 'scripts/tally-branding-qa.cjs'
      - 'scripts/tally-embed-qa.cjs'
      - '.github/workflows/tally-branding-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tally-branding:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Read-only smoke test all published Tally forms
        run: node scripts/tally-branding-qa.cjs
      - name: Check consent-gated iframe versions on public websites
        run: node scripts/tally-embed-qa.cjs
