name: Verify Tally white-label public forms
on:
  pull_request:
    paths:
      - 'scripts/check-tally-branding.cjs'
      - '.github/workflows/tally-branding-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-branding:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install read-only browser checker
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Check all eight public Tally forms without submitting
        run: node scripts/check-tally-branding.cjs
