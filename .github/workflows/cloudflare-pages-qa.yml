name: Check Cloudflare Pages package
on:
  pull_request:
    paths:
      - "dist/**"
      - "scripts/build-cloudflare-pages.sh"
      - ".github/workflows/cloudflare-pages-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static Cloudflare Pages output
        run: sh scripts/build-cloudflare-pages.sh
      - name: Verify important files and security baseline
        run: |
          test -s cf-dist/index.html
          test -s cf-dist/impressum.html
          test -s cf-dist/datenschutz.html
          test -s cf-dist/robots.txt
          test -s cf-dist/sitemap.xml
          test ! -e cf-dist/.htaccess
          grep -q 'X-Content-Type-Options: nosniff' cf-dist/_headers
          grep -q 'Content-Security-Policy:' cf-dist/_headers
          node --check cf-dist/app.js
          node --check cf-dist/analytics.js
